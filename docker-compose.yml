services:
  db:
    image: postgres:16-alpine
    container_name: atm-locator-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: atm_locator
    ports:
      - "5433:5432"
    volumes:
      - atm_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d atm_locator"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  atm_pg_data:
